name: 功能建议
description: 提一个功能、体验或工程上的改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本项目是演示项目，范围被刻意收窄（见 README「已知限制」）。
        请先说明你的建议解决什么问题，再谈怎么实现；与现有约束冲突的方案（例如引入第三方 UI 库、给管理端加第 5 个 Tab）大概率不会被采纳。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在哪里不好用、缺了什么
      placeholder: 例如：顾客下单后无法查看预计出餐时间
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望怎样解决；如果涉及数据模型或服务层，请说明影响范围
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 顾客端
        - 老板管理端
        - 调酒师工作台
        - 数据模型 / services
        - 工程与文档
        - 视觉与字体
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案（可选）
      description: 你考虑过的其他做法，以及为什么排除
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已读过 README 的「已知限制」，确认该建议不与其中的演示边界冲突
          required: true
        - label: 我理解这是演示项目，维护者可能不实现该建议
          required: true